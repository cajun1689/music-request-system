name: Test DJ Bridge

on:
  pull_request:
    paths:
      - 'rekordbox-agent/**'
      - 'grandma3-director-review/**'
      - '.github/workflows/test-dj-bridge.yml'
      - '.github/workflows/build-rekordbox-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dj-bridge-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-lighting:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: rekordbox-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rekordbox-agent/package-lock.json
      - name: Check native test host
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e 'if (process.arch !== process.env.EXPECTED_ARCH) throw new Error("Use a native runner for each architecture")'
      - run: npm ci --ignore-scripts
      - name: Check generated director review assets
        run: |
          python3 ../grandma3-director-review/build.py
          git diff --exit-code -- ../grandma3-director-review/generated
      - run: npm test
      - name: Verify universal receiver
        run: |
          lipo resources/lighting/DJLightingReceiver -verify_arch arm64
          lipo resources/lighting/DJLightingReceiver -verify_arch x86_64
      - name: Prepare matching Electron database module
        run: |
          brew install python-setuptools
          node node_modules/electron/install.js
          npx electron-builder install-app-deps
      - name: Check read-only Serato history in Electron
        run: ELECTRON_RUN_AS_NODE=1 node_modules/electron/dist/Electron.app/Contents/MacOS/Electron scripts/test-lighting-sqlite.js

name: Deploy Frontend & Infrastructure

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "infrastructure/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    outputs:
      frontend-bucket: ${{ steps.outputs.outputs.bucket }}
      distribution-id: ${{ steps.outputs.outputs.distribution }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Store Stripe runtime secrets
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          test -n "$STRIPE_SECRET_KEY"
          test -n "$STRIPE_WEBHOOK_SECRET"
          aws ssm put-parameter \
            --name "/music-request/prod/stripe-secret-key" \
            --type SecureString \
            --value "$STRIPE_SECRET_KEY" \
            --overwrite
          aws ssm put-parameter \
            --name "/music-request/prod/stripe-webhook-secret" \
            --type SecureString \
            --value "$STRIPE_WEBHOOK_SECRET" \
            --overwrite

      - name: Install backend dependencies
        run: npm ci && npm run typecheck
        working-directory: backend

      - name: Install infrastructure dependencies
        run: npm ci && npm run build && npm test -- --runInBand
        working-directory: infrastructure

      - name: CDK diff
        run: npx cdk diff 2>&1 || true
        working-directory: infrastructure
        env:
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_ENVIRONMENT: ${{ secrets.PAYPAL_ENVIRONMENT }}
          PAYPAL_WEBHOOK_ID: ${{ secrets.PAYPAL_WEBHOOK_ID }}
          STRIPE_DJ_PRICE_ID: ${{ secrets.STRIPE_DJ_PRICE_ID }}
          STRIPE_ORGANIZATION_PRICE_ID: ${{ secrets.STRIPE_ORGANIZATION_PRICE_ID }}
          ALARM_EMAIL: ${{ secrets.ALARM_EMAIL }}

      - name: CDK deploy
        run: npx cdk deploy --require-approval never --outputs-file cdk-outputs.json
        working-directory: infrastructure
        env:
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_ENVIRONMENT: ${{ secrets.PAYPAL_ENVIRONMENT }}
          PAYPAL_WEBHOOK_ID: ${{ secrets.PAYPAL_WEBHOOK_ID }}
          STRIPE_DJ_PRICE_ID: ${{ secrets.STRIPE_DJ_PRICE_ID }}
          STRIPE_ORGANIZATION_PRICE_ID: ${{ secrets.STRIPE_ORGANIZATION_PRICE_ID }}
          ALARM_EMAIL: ${{ secrets.ALARM_EMAIL }}

      - name: Apply idempotent MAPL tenant migration
        run: |
          MIGRATION_FN=$(jq -r '.InfrastructureStack.LegacyMigrationFunctionName' cdk-outputs.json)
          aws lambda invoke --function-name "$MIGRATION_FN" /tmp/legacy-migration.json
          jq -e 'has("errorMessage") | not' /tmp/legacy-migration.json
        working-directory: infrastructure

      - name: Extract stack outputs
        id: outputs
        run: |
          BUCKET=$(jq -r '.InfrastructureStack.FrontendBucketName // empty' cdk-outputs.json)
          DIST_ID=$(jq -r '.InfrastructureStack.CloudFrontDistributionId // empty' cdk-outputs.json)
          test -n "$BUCKET"
          test -n "$DIST_ID"
          echo "bucket=${BUCKET}" >> "$GITHUB_OUTPUT"
          echo "distribution=${DIST_ID}" >> "$GITHUB_OUTPUT"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_SENTRY_ENV: production
          VITE_RELEASE: ${{ github.sha }}

      - name: Determine S3 bucket
        id: bucket
        run: |
          BUCKET="${{ needs.deploy-infrastructure.outputs.frontend-bucket }}"
          test -n "$BUCKET"
          echo "name=${BUCKET}" >> "$GITHUB_OUTPUT"

      - name: Sync to S3
        run: aws s3 sync dist "s3://${{ steps.bucket.outputs.name }}" --delete
        working-directory: frontend

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID="${{ needs.deploy-infrastructure.outputs.distribution }}"
          if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ]; then
            aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
          fi
